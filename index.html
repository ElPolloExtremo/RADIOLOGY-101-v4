<title>Radiology 101</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: fondo verde azulado, tarjetas de tono apagado con texto negro, cabecera con flecha y tres puntos, botón + flotante, barra LISTO en edición. */
:root {
  --bg: #004F55;
  --bg-2: #0A6068;
  --line: #1D808A;
  --card: #86ADB0;
  --card-2: #A3C3C5;
  --ink: #071C1F;
  --fg: #EAF5F5;
  --muted: #A9CED0;
  --ok: #3FBF6B;
  --danger: #FFB4AB;
  --frame: #04090A;
  --fab: #274A4E;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: transparent; color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
h1, h2, h3 { font-family: var(--font-head); margin: 0; line-height: 1.12; text-wrap: balance; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 760px; margin-inline: auto; width: 100%; min-width: 0; }

/* Cabecera */
.bgfix { position: fixed; inset: 0; z-index: -1; background: var(--bg) url("bg-app.svg") center / cover no-repeat; }
.top { position: sticky; top: 0; z-index: 30; background: rgba(0, 62, 69, 0.78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.top .in { height: var(--top-h); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brandtxt { font-family: var(--font-head); font-weight: 700; font-size: 20px; letter-spacing: 0.08em; }
.iconbtn { background: none; border: 0; width: 48px; height: 48px; display: grid; place-items: center; cursor: pointer; border-radius: 12px; color: var(--fg); margin-inline: -8px; }
.iconbtn:hover { background: rgba(255, 255, 255, 0.08); }
.menu { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) - 6px); right: max(12px, env(safe-area-inset-right, 0px)); background: var(--card); color: var(--ink); border-radius: 14px; padding: 6px; min-width: 232px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; }
.menu button { background: none; border: 0; text-align: left; padding: 12px 14px; min-height: 46px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--ink); }
.menu button:hover { background: rgba(0, 0, 0, 0.1); }
.menu button.danger { color: #8A1810; }

main { padding-block: 8px 120px; }
.page-head { margin: 4px 0 18px; display: flex; flex-direction: column; gap: 4px; }
.crumb { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.page-head h1 { font-size: clamp(30px, 8vw, 40px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; }
.meta { color: var(--muted); font-size: 14px; }
.empty { border: 2px dashed var(--line); border-radius: 18px; padding: 24px 18px; text-align: center; color: var(--muted); }

/* Tarjetas */
.search input { width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; min-height: 50px; color: var(--fg); }
.search input::placeholder { color: var(--muted); }
.search { margin: 4px 0 22px; }
.group { margin-bottom: 26px; }
.group h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
.group h2 i { font-style: normal; font-family: var(--font-mono); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card { background: var(--card); color: var(--ink); border: 0; border-radius: 20px; padding: 14px 14px 12px; min-height: 104px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; width: 100%; }
.card:active { background: var(--card-2); }
.card b { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 1.12; overflow-wrap: break-word; hyphens: auto; }
.card small { font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; gap: 8px; color: #123237; }
.bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, 0.18); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 11px; height: 11px; border-radius: 3px; border: 2px solid var(--ink); display: block; }
.dots i.on { background: var(--ink); }
.rows { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row-main { width: 100%; background: var(--card); color: var(--ink); border: 0; border-radius: 16px; padding: 12px 16px; min-height: 60px; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rn { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.rs { display: block; font-size: 13px; font-weight: 500; color: #123237; }

/* Botones */
.fab { position: fixed; z-index: 25; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; border-radius: 50%; background: var(--fab); border: 2px solid var(--card); color: var(--card); cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
.fab:active { transform: scale(0.96); }
.donebar { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: rgba(0, 62, 69, 0.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.donebar .in { display: flex; justify-content: center; }
.done { background: var(--ok); color: #04230F; border: 0; border-radius: 14px; min-height: 52px; padding: 0 40px; font-family: var(--font-head); font-weight: 700; font-size: 20px; letter-spacing: 0.1em; cursor: pointer; width: min(340px, 100%); }
.btn { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; min-height: 46px; cursor: pointer; font-weight: 600; color: var(--fg); }
.btn.primary { background: var(--card); border-color: var(--card); color: var(--ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #4A0B06; }
.ib { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; width: 44px; height: 44px; cursor: pointer; flex: none; font-size: 17px; padding: 0; color: var(--fg); }
.ib:disabled { opacity: 0.35; cursor: default; }
.ib.danger { color: var(--danger); }
.ctl { display: flex; gap: 6px; }

/* Ficha */
.titlecard { background: var(--card); color: var(--ink); border-radius: 22px; padding: 18px 20px 20px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.titlecard .crumb { color: #123237; }
.titlecard h1 { font-size: clamp(34px, 11vw, 52px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); color: var(--ink); border: 0; border-radius: 20px; padding: 0; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; text-align: left; min-width: 0; }
.tphoto { display: grid; place-items: center; position: relative; aspect-ratio: 1 / 1; background: var(--frame); overflow: hidden; width: 100%; }
.tphoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tphoto .none, .tphoto .snip { padding: 12px; text-align: center; font-size: 14px; }
.tphoto .none { color: #9DB8BA; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tphoto .snip { color: #E3EEEE; text-align: left; align-self: start; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
.badge { position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, 0.7); color: #fff; border-radius: 999px; padding: 1px 9px; font-family: var(--font-mono); font-size: 12px; }
.tlabel { padding: 10px 14px 12px; font-family: var(--font-head); font-weight: 700; font-size: 18px; line-height: 1.15; }
.sh { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 30px 0 12px; }
.crit { list-style: none; margin: 0; padding: 0; max-width: 66ch; }
.crit li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.crit li::before { content: "✓"; color: var(--card); font-weight: 700; flex: none; width: 18px; }
.crit li:last-child { border-bottom: 0; }
.ph { border: 2px dashed var(--line); border-radius: 18px; padding: 20px; text-align: center; color: var(--muted); }
.smalltiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.smalltiles .tile { border-radius: 14px; }
.smalltiles .tphoto { aspect-ratio: 1/1; }

/* Edición */
.lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.titlecard .lbl { color: #123237; }
.cin { width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; min-height: 46px; resize: none; display: block; overflow: hidden; color: var(--fg); }
.titlecard .cin { background: rgba(255, 255, 255, 0.55); border-color: transparent; color: var(--ink); font-family: var(--font-head); font-weight: 700; font-size: 26px; text-transform: uppercase; }
.etiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.etile { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.etile .tphoto { border-radius: 16px; }
.etile .ctl .ib { flex: 1; }
.upl { background: var(--card); color: var(--ink); border: 0; border-radius: 16px; aspect-ratio: 1 / 1; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
.tb { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.critrow { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 8px; }
.critrow .cin { flex: 1; min-width: 0; }
.addline { margin-top: 6px; }

/* Visor */
.lb { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lb-top { display: flex; align-items: center; gap: 8px; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); height: var(--top-h); flex: none; }
.lb-top h2 { flex: 1; font-size: 20px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
#lbCount { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.lb-stage { flex: 1 1 0; min-height: 200px; overflow: auto; display: grid; place-items: center; background: var(--frame); touch-action: pan-x pan-y pinch-zoom; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
.lb-stage.zoomed { place-items: start; }
.lb-stage.zoomed img { max-width: none; max-height: none; width: 250%; height: auto; cursor: zoom-out; }
.lb-nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 8px max(16px, env(safe-area-inset-left, 0px)); flex: none; }
.lb-nav .btn { min-width: 52px; }
.lb-info { flex: 0 1 auto; max-height: 40%; overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 16px; }
.lb-info.only { max-height: none; flex: 1; }
.lb-info .cap { color: var(--muted); font-size: 14px; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 66ch; }

/* Diálogo, aviso e inicio */
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; padding: 16px; }
.mcard { background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 22px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow: auto; }
.mcard h2 { font-size: 24px; font-weight: 700; }
.mcard p { color: var(--muted); }
.mfield label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
.mfield { margin-bottom: 10px; }
.mbtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: #EAF5F5; color: var(--ink); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); }
.warn { background: #6B3A00; color: #FFE7C2; font-size: 13px; padding-block: 8px; }

.splash { position: fixed; inset: 0; z-index: 100; background: var(--bg) url("bg-splash.svg") center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; cursor: pointer; }
.splash .logo { position: relative; width: 104px; height: 104px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0, 20, 24, 0.55); margin-bottom: 22px; }
.splash h1 { position: relative; font-size: clamp(46px, 15vw, 82px); font-weight: 700; letter-spacing: 0.04em; color: #fff; text-shadow: 0 2px 18px rgba(0, 20, 22, 0.75); }
.splash p { position: absolute; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; letter-spacing: 0.06em; }
.splash.out { opacity: 0; pointer-events: none; transition: opacity 0.4s; }
@media (prefers-reduced-motion: reduce) { .splash.out { transition: none; } }
.card, .tile, .row-main, .fab, .iconbtn, .menu button, .done { transition: transform 0.14s ease, filter 0.14s ease, background-color 0.15s; }
.pressed { transform: scale(0.95); filter: brightness(1.14); }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.enter { animation: enter 0.26s ease-out; }
.lb { animation: fadein 0.2s ease-out; }
@media (prefers-reduced-motion: reduce) { .enter, .lb { animation: none; } .pressed { transform: none; } .card, .tile, .row-main, .fab, .iconbtn, .menu button, .done { transition: none; } }
.notecard { margin-top: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px 18px; }
.notecard h3 { font-size: 18px; font-weight: 700; }
.notecard h3 ~ h3 { margin-top: 20px; }
.notecard .tb { margin-top: 10px; }

/* Pantalla de divisiones */
.gcard { position: relative; min-height: 158px; justify-content: flex-start; gap: 6px; overflow: hidden; }
.gcard b { font-size: 21px; max-width: 100%; position: relative; z-index: 1; }
.gcard small { position: relative; z-index: 1; display: block; line-height: 1.35; }
.gicon { position: absolute; right: 8px; bottom: 8px; width: 47%; max-width: 96px; aspect-ratio: 1 / 1; object-fit: contain; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0, 30, 34, 0.25)); }
.ghead { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.gicon-head { width: 84px; height: 84px; object-fit: contain; flex: none; filter: drop-shadow(0 4px 10px rgba(0, 20, 24, 0.4)); }
/* Ficha V4: título compacto, rayos X grande al centro, posicionamiento abajo, criterios al final */
.titlecard.slim { padding: 12px 18px 14px; gap: 2px; margin-bottom: 18px; }
.titlecard.slim h1 { font-size: clamp(24px, 7vw, 32px); }
.hero { width: 100%; margin: 0 auto; border-radius: 24px; display: flex; box-shadow: 0 10px 28px rgba(0, 20, 24, 0.35); }
.hero .tphoto { max-height: 74vh; background: #003A40; }
.hero .tphoto img { object-fit: contain; }
.hero .tlabel { text-align: center; padding: 10px 14px 12px; }
.herocap { width: 100%; margin: 10px auto 0; color: var(--muted); font-size: 14px; text-align: center; }
/* El texto rodea la imagen: queda a su lado y luego continúa a todo el ancho por debajo */
.poscard { margin-top: 22px; background: var(--card); color: var(--ink); border-radius: 22px; padding: 12px; display: flow-root; }
.posimg { float: left; width: 42%; margin: 0 12px 10px 0; background: none; border: 0; padding: 0; cursor: pointer; display: block; border-radius: 16px; overflow: hidden; transition: transform 0.14s ease, filter 0.14s ease; }
.posimg .tphoto { aspect-ratio: 1 / 1; background: #F4F8F8; border-radius: 16px; }
.posimg .tphoto img { object-fit: contain; }
.posimg .tphoto .none { color: #5D7C7F; }
.postext { padding: 4px 4px 0 0; }
.postext h3 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; text-wrap: wrap; -webkit-hyphens: auto; hyphens: auto; }
.postext .tb { margin-top: 8px; display: block; }
.postext .lbl { color: #0B2A2E; font-weight: 700; font-size: 13px; }
.postext .txt { font-size: 14px; line-height: 1.45; text-align: justify; -webkit-hyphens: auto; hyphens: auto; }
.phs { margin-top: 8px; font-size: 14px; opacity: 0.7; }
.critcard { margin-top: 22px; background: rgba(0, 40, 46, 0.55); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px 18px; }
.critcard h2 { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
.critcard .phs { color: var(--muted); opacity: 1; text-align: center; }
.critcard .smalltiles { margin-top: 14px; }
.critcard .crit { max-width: none; }
.critcard .crit li { font-size: 17px; text-align: justify; -webkit-hyphens: auto; hyphens: auto; }
.critcard .crit li span { flex: 1; min-width: 0; }

/* Fondo fijo: se dimensiona a la pantalla grande del celular para que no salte al ocultarse la barra del navegador */
.bgfix { height: 100vh; height: 100lvh; bottom: auto; transform: translateZ(0); will-change: transform; }

/* Transición al abrir una proyección */
.titlecard.slim { view-transition-name: ptitle; }
::view-transition-group(ptitle) { animation-duration: 0.34s; animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1); }
::view-transition-old(root) { animation: 0.18s ease-out both vt-out; }
::view-transition-new(root) { animation: 0.3s ease-out 0.06s both vt-in; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(14px); } }
@media (max-width: 360px) { .posimg { float: none; width: 100%; margin: 0 0 12px; } }

/* ===== Modo oscuro: gris carbón con acentos ámbar ===== */
.topr { display: flex; align-items: center; gap: 4px; }
.themebtn { color: var(--fg); }
html[data-theme="dark"] {
  --bg: #2B2B2B; --bg-2: #353330; --line: #5A4A33; --card: #1F1F1F; --card-2: #2A2620;
  --ink: #F3EEE6; --fg: #F3EEE6; --muted: #CDBB9F; --frame: #0E0E0E; --fab: #1F1F1F; --accent: #E5A84B;
  --danger: #FFB0A3;
}
html[data-theme="dark"] .bgfix { background-image: url("bg-app-dark.svg"); }
html[data-theme="dark"] .splash { background-image: url("bg-splash-dark.svg"); }
html[data-theme="dark"] .themebtn { color: #F2B63A; }
html[data-theme="dark"] .top, html[data-theme="dark"] .donebar { background: rgba(30, 28, 26, 0.84); }
html[data-theme="dark"] .card, html[data-theme="dark"] .row-main, html[data-theme="dark"] .titlecard,
html[data-theme="dark"] .tile, html[data-theme="dark"] .poscard, html[data-theme="dark"] .upl { border: 2px solid var(--accent); }
html[data-theme="dark"] .card:active { background: var(--card-2); }
html[data-theme="dark"] .card small, html[data-theme="dark"] .rs, html[data-theme="dark"] .titlecard .crumb,
html[data-theme="dark"] .titlecard .lbl { color: var(--muted); }
html[data-theme="dark"] .postext .lbl { color: var(--accent); }
html[data-theme="dark"] .bar { background: rgba(255, 255, 255, 0.14); }
html[data-theme="dark"] .bar i { background: var(--accent); }
html[data-theme="dark"] .crit li::before { color: var(--accent); }
html[data-theme="dark"] .critcard { background: #262626; border-color: #3A3631; }

<body>

<div class="bgfix" aria-hidden="true"></div>
<header id="top" class="top gut"></header>
<div id="warn" class="warn gut" hidden><div class="in">Este navegador no permite guardar datos. Lo que cargues se perderá al cerrar la página.</div></div>
<div id="menu" class="menu" role="menu" hidden></div>
<main class="gut"><div class="in" id="view"></div></main>

<button id="fab" class="fab" type="button" data-act="fab" aria-label="Agregar" hidden>
  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5v20M5 15h20"/></svg>
</button>
<div id="donebar" class="donebar gut" hidden><div class="in"><button type="button" class="done" data-act="done">LISTO</button></div></div>

<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fImp" accept="application/json,.json" hidden>

<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Detalle">
  <div class="lb-top"><button type="button" class="iconbtn" id="lbClose" aria-label="Volver"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 15H5M13 7L5 15l8 8"/></svg></button><h2 id="lbTitle"></h2><span id="lbCount"></span></div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-nav" id="lbNav"><button type="button" class="btn" id="lbPrev" aria-label="Imagen anterior">‹</button><button type="button" class="btn" id="lbZoom">Zoom</button><button type="button" class="btn" id="lbNext" aria-label="Imagen siguiente">›</button></div>
  <div class="lb-info" id="lbInfo"></div>
</div>

<div id="modal" class="modal" hidden>
  <form id="mform" class="mcard" novalidate>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <div id="mfields"></div>
    <div class="mbtns"><button type="button" class="btn" id="mcancel">Cancelar</button><button type="submit" class="btn primary" id="mok">Aceptar</button></div>
  </form>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<div id="splash" class="splash" role="presentation">
  <img class="logo" src="icon-192.png" alt="">
  <h1>RADIOLOGY<br>101</h1>
  <p id="appVersion">v 9.0.0</p>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Estructura base: solo nombres ---------- */
  var SEED = [
    ['Cabeza y cuello', [
      ['Cráneo', ['Cráneo AP', 'Cráneo PA', 'Cráneo lateral', 'Towne (AP axial)', 'Caldwell (PA axial)', 'Submentovertex (Hirtz)']],
      ['Senos paranasales', ['Senos paranasales Waters', 'Senos paranasales Caldwell', 'Senos paranasales lateral', 'Senos paranasales submentovertex']],
      ['Órbitas', ['Órbitas Caldwell', 'Órbitas Waters', 'Órbita lateral', 'Órbita oblicua (Rhese)']],
      ['Huesos nasales', ['Huesos nasales lateral', 'Huesos nasales axial']],
      ['Mandíbula', ['Mandíbula PA', 'Mandíbula AP axial (Towne)', 'Mandíbula oblicua axiolateral', 'Panorámica (ortopantomografía)']],
      ['Articulación temporomandibular', ['ATM lateral boca cerrada', 'ATM lateral boca abierta', 'ATM AP axial (Towne)']],
      ['Arcos cigomáticos', ['Arcos cigomáticos submentovertex', 'Arcos cigomáticos oblicua tangencial']],
      ['Mastoides y peñascos', ['Schüller', 'Law', 'Stenvers', 'Mayer']]
    ]],
    ['Columna', [
      ['Columna cervical', ['Columna cervical AP', 'Columna cervical lateral', 'Columna cervical oblicuas', 'Odontoides boca abierta', 'Columna cervical lateral en flexión', 'Columna cervical lateral en extensión']],
      ['Columna dorsal', ['Columna dorsal AP', 'Columna dorsal lateral', 'Unión cervicodorsal (nadador)']],
      ['Columna lumbar', ['Columna lumbar AP', 'Columna lumbar lateral', 'Columna lumbar oblicuas', 'Lateral L5-S1', 'Columna lumbar lateral en flexión', 'Columna lumbar lateral en extensión']],
      ['Sacro y cóccix', ['Sacro AP axial', 'Sacro lateral', 'Cóccix AP axial', 'Cóccix lateral']],
      ['Articulaciones sacroilíacas', ['Sacroilíacas AP axial', 'Sacroilíacas oblicuas posteriores']],
      ['Columna total (escoliosis)', ['Columna total AP de pie', 'Columna total lateral de pie']]
    ]],
    ['Tórax y abdomen', [
      ['Tórax', ['Tórax PA', 'Tórax lateral', 'Tórax AP', 'Tórax oblicuas', 'Lordótica apical', 'Tórax decúbito lateral']],
      ['Costillas', ['Costillas AP', 'Costillas PA', 'Costillas oblicuas']],
      ['Esternón', ['Esternón oblicua', 'Esternón lateral']],
      ['Articulaciones esternoclaviculares', ['Esternoclaviculares PA', 'Esternoclaviculares oblicuas']],
      ['Abdomen', ['Abdomen AP supino', 'Abdomen AP de pie', 'Abdomen decúbito lateral']]
    ]],
    ['Miembro superior', [
      ['Clavícula', ['Clavícula AP', 'Clavícula AP axial']],
      ['Articulación acromioclavicular', ['Acromioclavicular AP bilateral', 'Acromioclavicular AP con carga']],
      ['Hombro', ['Hombro AP rotación neutra', 'Hombro AP rotación interna', 'Hombro AP rotación externa', 'Hombro axial', 'Hombro transtorácica']],
      ['Escápula', ['Escápula AP', 'Escápula lateral (en Y)']],
      ['Húmero', ['Húmero AP', 'Húmero lateral']],
      ['Codo', ['Codo AP', 'Codo lateral', 'Codo oblicua interna', 'Codo oblicua externa', 'Codo axial (Jones)']],
      ['Antebrazo', ['Antebrazo AP', 'Antebrazo lateral']],
      ['Muñeca', ['Muñeca PA', 'Muñeca lateral', 'Muñeca oblicua', 'Muñeca desviación cubital', 'Túnel carpiano']],
      ['Mano', ['Mano PA', 'Mano oblicua', 'Mano lateral en abanico']],
      ['Dedos de la mano', ['Dedos PA', 'Dedos oblicua', 'Dedos lateral']],
      ['Pulgar', ['Pulgar AP', 'Pulgar lateral', 'Pulgar oblicua']]
    ]],
    ['Pelvis y miembro inferior', [
      ['Pelvis', ['Pelvis AP', 'Pelvis Inlet', 'Pelvis Outlet']],
      ['Cadera', ['Cadera AP', 'Cadera axiolateral (Danelius-Miller)', 'Cadera en rana (Lauenstein)']],
      ['Fémur', ['Fémur AP', 'Fémur lateral']],
      ['Rodilla', ['Rodilla AP', 'Rodilla lateral', 'Rodilla oblicua interna', 'Rodilla oblicua externa', 'Intercondílea (Holmblad)']],
      ['Rótula', ['Rótula lateral', 'Rótula axial (Merchant)']],
      ['Pierna (tibia y peroné)', ['Pierna AP', 'Pierna lateral']],
      ['Tobillo', ['Tobillo AP', 'Tobillo mortaja', 'Tobillo lateral', 'Tobillo oblicua']],
      ['Pie', ['Pie AP', 'Pie oblicua', 'Pie lateral']],
      ['Calcáneo', ['Calcáneo axial', 'Calcáneo lateral']],
      ['Dedos del pie', ['Dedos del pie AP', 'Dedos del pie oblicua', 'Dedos del pie lateral']]
    ]]
  ];
  /* Divisiones de la pantalla de inicio, en orden, con su ilustración */
  var GROUPS = [['Cabeza y cuello', 'grp-cabeza.png'], ['Columna', 'grp-columna.png'], ['Tórax y abdomen', 'grp-torax.png'], ['Miembro superior', 'grp-msup.png'], ['Pelvis', 'grp-pelvis.png'], ['Miembro inferior', 'grp-minf.png']];
  function groupFor(name, group) {
    if (group === 'Pelvis y miembro inferior') return (name === 'Pelvis' || name === 'Cadera') ? 'Pelvis' : 'Miembro inferior';
    return group;
  }
  var SECS = {
    result: { title: 'Imagen de la proyección', short: 'Imagen' },
    position: { title: 'Posicionamiento y angulación', short: 'Posicionamiento' },
    quality: { title: 'Imágenes de apoyo', short: 'Calidad' }
  };
  var ICON = {
    moon: '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M17.6 3.2a10 10 0 1 0 5.2 13.4A8.2 8.2 0 0 1 17.6 3.2z" fill="currentColor"/></svg>',
    back: '<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 15H5M13 7L5 15l8 8"/></svg>',
    dots: '<svg width="30" height="30" viewBox="0 0 30 30" fill="currentColor" aria-hidden="true"><circle cx="15" cy="6" r="2.6"/><circle cx="15" cy="15" r="2.6"/><circle cx="15" cy="24" r="2.6"/></svg>',
    upload: '<svg width="46" height="46" viewBox="0 0 46 46" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 31V9M13 18l10-10 10 10M6 32v6a2 2 0 002 2h30a2 2 0 002-2v-6"/></svg>',
    img: '<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="26" height="22" rx="3"/><circle cx="12" cy="14" r="2.5"/><path d="M4 24l8-7 6 5 5-4 7 6"/></svg>'
  };
  var MAX_SIDE = 1600, MAX_TXT = 4000;

  /* ---------- Utilidades ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
  function str(v, n) { return String(v == null ? '' : v).slice(0, n); }
  function sid(v, seen) {
    var s = String(v || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 24);
    if (!s || (seen && seen[s])) s = uid();
    if (seen) seen[s] = 1;
    return s;
  }
  function num(v, d) { v = Number(v); return isFinite(v) && v > 0 && v < 20000 ? Math.round(v) : d; }
  function move(arr, i, dir) {
    var j = i + dir;
    if (j < 0 || j >= arr.length) return false;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    return true;
  }
  var toastT = null;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3200);
  }

  /* ---------- Almacenamiento (IndexedDB con respaldo en memoria) ---------- */
  var db = null, memKV = {}, memImg = {}, urlCache = {};
  function openDB() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open('radiology101', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
        r.onblocked = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function tx(store, mode, fn) {
    return new Promise(function (res, rej) {
      try {
        var t = db.transaction(store, mode), s = t.objectStore(store), out = fn(s);
        t.oncomplete = function () { res(out && out.result !== undefined ? out.result : undefined); };
        t.onerror = t.onabort = function () { rej(t.error); };
      } catch (e) { rej(e); }
    });
  }
  function kvGet(k) { return db ? tx('kv', 'readonly', function (s) { return s.get(k); }).catch(function () { return null; }) : Promise.resolve(memKV[k]); }
  function kvPut(k, v) { if (!db) { memKV[k] = v; return Promise.resolve(); } return tx('kv', 'readwrite', function (s) { s.put(v, k); }).catch(function () { toast('No se pudo guardar. Revisa el espacio del dispositivo.'); }); }
  function imgGet(id) { return db ? tx('img', 'readonly', function (s) { return s.get(id); }).catch(function () { return null; }) : Promise.resolve(memImg[id] || null); }
  function imgPut(id, blob) { if (!db) { memImg[id] = blob; return Promise.resolve(); } return tx('img', 'readwrite', function (s) { s.put(blob, id); }); }
  function revokeURL(id) { if (urlCache[id]) { try { URL.revokeObjectURL(urlCache[id]); } catch (e) {} delete urlCache[id]; } }
  function imgDel(id) {
    revokeURL(id);
    if (!db) { delete memImg[id]; return Promise.resolve(); }
    return tx('img', 'readwrite', function (s) { s.delete(id); }).catch(function () {});
  }
  function imgClear() {
    Object.keys(urlCache).forEach(revokeURL);
    if (!db) { memImg = {}; return Promise.resolve(); }
    return tx('img', 'readwrite', function (s) { s.clear(); }).catch(function () {});
  }
  function imgURL(id) {
    if (urlCache[id]) return Promise.resolve(urlCache[id]);
    return imgGet(id).then(function (b) {
      if (!b) return null;
      urlCache[id] = URL.createObjectURL(b);
      return urlCache[id];
    });
  }

  /* ---------- Datos ---------- */
  var data = { regions: [] };
  function mkProj(name) {
    return { id: uid(), name: name, result: { images: [], text: '' }, position: { images: [], patient: '', tube: '' }, quality: { items: [], images: [] } };
  }
  function seedData() {
    var regs = [];
    SEED.forEach(function (g) {
      g[1].forEach(function (r) { regs.push({ id: uid(), name: r[0], group: groupFor(r[0], g[0]), projs: r[1].map(mkProj) }); });
    });
    return { regions: regs };
  }
  function sanImgs(a, seen) {
    return (Array.isArray(a) ? a : []).slice(0, 40).map(function (im) {
      im = im || {};
      return { id: sid(im.id, seen), w: num(im.w, 4), h: num(im.h, 3), cap: str(im.cap, 300) };
    });
  }
  function sanitize(d) {
    var seenR = {}, seenP = {}, seenI = {};
    var regs = (d && Array.isArray(d.regions) ? d.regions : []).slice(0, 300).map(function (r) {
      r = r || {};
      return {
        id: sid(r.id, seenR), name: str(r.name, 80) || 'Región', group: groupFor(str(r.name, 80), str(r.group, 80)) || 'Otras',
        projs: (Array.isArray(r.projs) ? r.projs : []).slice(0, 300).map(function (p) {
          p = p || {};
          var rs = p.result || {}, po = p.position || {}, q = p.quality || {};
          return {
            id: sid(p.id, seenP), name: str(p.name, 100) || 'Proyección',
            result: { images: sanImgs(rs.images, seenI), text: str(rs.text, MAX_TXT) },
            position: { images: sanImgs(po.images, seenI), patient: str(po.patient, MAX_TXT), tube: str(po.tube, MAX_TXT) },
            quality: { items: (Array.isArray(q.items) ? q.items : []).slice(0, 80).map(function (x) { return str(x, 400); }), images: sanImgs(q.images, seenI) }
          };
        })
      };
    });
    return { regions: regs };
  }
  var saveT = null;
  function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveNow, 350); }
  function saveNow() { clearTimeout(saveT); return kvPut('data', data); }
  function findR(id) { for (var i = 0; i < data.regions.length; i++) if (data.regions[i].id === id) return data.regions[i]; return null; }
  function findP(r, id) { if (!r) return null; for (var i = 0; i < r.projs.length; i++) if (r.projs[i].id === id) return r.projs[i]; return null; }
  function projImgIds(p) { return [].concat(p.result.images, p.position.images, p.quality.images).map(function (x) { return x.id; }); }
  function allImgIds(d) {
    var ids = [];
    d.regions.forEach(function (r) { r.projs.forEach(function (p) { ids = ids.concat(projImgIds(p)); }); });
    return ids;
  }
  function filled(p) {
    return {
      r: p.result.images.length > 0 || !!p.result.text.trim(),
      p: p.position.images.length > 0 || !!p.position.patient.trim() || !!p.position.tube.trim(),
      q: p.quality.items.length > 0 || p.quality.images.length > 0
    };
  }
  function anyFilled(p) { var f = filled(p); return f.r || f.p || f.q; }
  function curR() { return findR(view.rid); }
  function curP() { return findP(findR(view.rid), view.pid); }
  function groups() { var s = {}; data.regions.forEach(function (r) { s[r.group] = 1; }); return Object.keys(s); }
  function allGroups() { var out = GROUPS.map(function (g) { return g[0]; }); groups().forEach(function (g) { if (out.indexOf(g) === -1) out.push(g); }); return out; }

  /* ---------- Vista y navegación ---------- */
  var view = { v: 'home', d: 0 }, edit = false, query = '', canPush = true;

  function validView(s) {
    if (!s || typeof s !== 'object') return null;
    var d = num(s.d, 0);
    if (s.v === 'region' && findR(s.rid)) return { v: 'region', rid: s.rid, d: d };
    if (s.v === 'sheet' && findP(findR(s.rid), s.pid)) return { v: 'sheet', rid: s.rid, pid: s.pid, d: d };
    if (s.v === 'group' && typeof s.g === 'string' && s.g) return { v: 'group', g: s.g.slice(0, 80), d: d };
    if (s.v === 'home') return { v: 'home', d: d };
    return null;
  }
  /* Transición entre pantallas: la burbuja tocada se expande hasta el título de la ficha (View Transitions), con respaldo de animación simple. */
  var VT = false;
  try { VT = !!document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  function clearVT() { document.querySelectorAll('.card, .row-main').forEach(function (el) { el.style.viewTransitionName = ''; }); }
  function swap(src, backPid) {
    var paint = function (anim) { render(anim); window.scrollTo(0, 0); };
    if (!VT) { paint(true); return; }
    clearVT();
    if (src) src.style.viewTransitionName = 'ptitle';
    var t = document.startViewTransition(function () {
      paint(false);
      if (backPid) {
        var c = document.querySelector('[data-act="open-proj"][data-pid="' + backPid + '"]');
        if (c) { c.style.viewTransitionName = 'ptitle'; c.scrollIntoView({ block: 'center' }); }
      }
    });
    t.finished.then(clearVT, clearVT);
  }
  function go(nv, src) {
    nv.d = (view.d || 0) + 1; view = nv; edit = false; hideMenu();
    if (canPush) { try { history.pushState(nv, ''); } catch (e) { canPush = false; nv.d = 0; } }
    swap(src);
  }
  function show(nv) {
    var back = view.v === 'sheet' ? view.pid : null;
    nv.d = 0; view = nv; edit = false; hideMenu();
    try { history.replaceState(nv, ''); } catch (e) {}
    swap(null, back);
  }
  function parentOf() {
    if (view.v === 'sheet') return { v: 'region', rid: view.rid };
    if (view.v === 'region') { var r = curR(); return r ? { v: 'group', g: r.group } : { v: 'home' }; }
    return { v: 'home' };
  }
  function up() {
    if (canPush && view.d > 0) history.back();
    else show(parentOf());
  }
  window.addEventListener('popstate', function (e) {
    if (lb.open) { lb.pushed = false; hideLb(); return; }
    var nv = validView(e.state) || { v: 'home', d: 0 };
    edit = false; hideMenu();
    if (nv.v === view.v && nv.rid === view.rid && nv.pid === view.pid) { view = nv; render(); return; }
    var back = view.v === 'sheet' ? view.pid : null;
    view = nv; swap(null, back);
  });

  /* ---------- Diálogo ---------- */
  var mResolve = null;
  function dialog(o) {
    return new Promise(function (resolve) {
      var fields = o.fields || [];
      $('mtitle').textContent = o.title;
      $('mtext').textContent = o.text || ''; $('mtext').hidden = !o.text;
      $('mfields').innerHTML = fields.map(function (f) {
        return '<div class="mfield"><label for="mf-' + f.name + '">' + esc(f.label) + '</label><input class="cin" id="mf-' + f.name + '" value="' + esc(f.value || '') + '" maxlength="80" autocomplete="off"' + (f.list ? ' list="ml-' + f.name + '"' : '') + '>' +
          (f.list ? '<datalist id="ml-' + f.name + '">' + f.list.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' : '') + '</div>';
      }).join('');
      var ok = $('mok'); ok.textContent = o.ok || 'Aceptar';
      ok.className = 'btn ' + (o.danger ? 'danger' : 'primary');
      $('mcancel').hidden = !!o.noCancel;
      $('modal').hidden = false;
      function done(v) { $('modal').hidden = true; mResolve = null; resolve(v); }
      mResolve = function () { done(null); };
      $('mform').onsubmit = function (e) {
        e.preventDefault();
        var vals = {}, bad = null;
        fields.forEach(function (f) {
          var v = $('mf-' + f.name).value.trim();
          vals[f.name] = v;
          if (f.required && !v && !bad) bad = f.name;
        });
        if (bad) { $('mf-' + bad).focus(); return; }
        done(vals);
      };
      $('mcancel').onclick = function () { done(null); };
      var first = fields.length ? $('mf-' + fields[0].name) : ok;
      first.focus(); if (fields.length && first.select) first.select();
    });
  }
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal') && mResolve) mResolve(); });

  /* ---------- Menú de tres puntos ---------- */

      a.download = 'radiology101-' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      toast('Respaldo listo. Revisa tus descargas.');
    }).catch(function () { toast('No se pudo generar el respaldo.'); });
  }
  /* Actualización de textos: mezcla un .json de textos (type "textos") sin tocar las imágenes. */
  function mergeTexts(j) {
    var regs = Array.isArray(j.regions) ? j.regions.slice(0, 300) : [];
    var findRegion = function (name) { var k = norm(String(name || '').trim()); for (var i = 0; i < data.regions.length; i++) if (norm(data.regions[i].name.trim()) === k) return data.regions[i]; return null; };
    var findProj = function (r, P) {
      if (!r) return null;
      var names = [P.name].concat(Array.isArray(P.aliases) ? P.aliases : []).map(function (x) { return norm(String(x || '').trim()); });
      for (var i = 0; i < r.projs.length; i++) if (names.indexOf(norm(r.projs[i].name.trim())) !== -1) return r.projs[i];
      return null;
    };
    var nUpd = 0, nNew = 0, nReg = 0;
    regs.forEach(function (R) {
      if (!R || !R.name) return;
      var r = findRegion(R.name);
      if (!r) nReg++;
      (Array.isArray(R.projs) ? R.projs : []).forEach(function (P) { if (P && P.name) { if (findProj(r, P)) nUpd++; else nNew++; } });
    });
    if (!nUpd && !nNew) { toast('El archivo no trae textos para cargar.'); return; }
    dialog({
      title: 'Actualizar textos',
      text: 'Se actualizarán los textos de ' + plural(nUpd, 'proyección', 'proyecciones') + ' y se agregarán ' + plural(nNew, 'proyección nueva', 'proyecciones nuevas') + (nReg ? ' (' + plural(nReg, 'región nueva', 'regiones nuevas') + ')' : '') + '. Los textos que ya tengan esas proyecciones se reemplazarán. Las imágenes no se tocan.',
      ok: 'Actualizar'
    }).then(function (ok) {
      if (!ok) return;
      regs.forEach(function (R) {
        if (!R || !R.name) return;
        var r = findRegion(R.name);
        if (!r) {
          r = { id: uid(), name: str(R.name, 80), group: groupFor(str(R.name, 80), str(R.group, 80)) || 'Otras', projs: [] };
          var last = -1; data.regions.forEach(function (x, i) { if (x.group === r.group) last = i; });
          if (last >= 0) data.regions.splice(last + 1, 0, r); else data.regions.push(r);
        }
        (Array.isArray(R.projs) ? R.projs : []).forEach(function (P) {
          if (!P || !P.name) return;
          var p = findProj(r, P);
          if (!p) { p = mkProj(str(P.name, 100)); r.projs.push(p); }
          else p.name = str(P.name, 100);
          if (P.result && typeof P.result.text === 'string') p.result.text = str(P.result.text, MAX_TXT);
          if (P.position && typeof P.position.patient === 'string') p.position.patient = str(P.position.patient, MAX_TXT);
          if (P.position && typeof P.position.tube === 'string') p.position.tube = str(P.position.tube, MAX_TXT);
          if (P.quality && Array.isArray(P.quality.items)) p.quality.items = P.quality.items.slice(0, 80).map(function (x) { return str(x, 400); });
        });
      });
      saveNow(); render();
      toast('Textos actualizados: ' + nUpd + ' actualizadas, ' + nNew + ' nuevas.');
    });
  }
  function importFile(file) {
    var rd = new FileReader();
    rd.onload = function () {
      var j, nd;
      try { j = JSON.parse(rd.result); } catch (e) { j = null; }
      if (j && j.app === 'radiology101' && j.type === 'textos') { mergeTexts(j); return; }
      try { if (!j || j.app !== 'radiology101' || !j.data) throw new Error('x'); nd = sanitize(j.data); }
      catch (e) { toast('El archivo no es un respaldo válido de Radiology 101.'); return; }
      var np = 0; nd.regions.forEach(function (r) { np += r.projs.length; });
      dialog({ title: 'Restaurar respaldo', text: 'Se reemplazará todo el contenido actual por el del respaldo (' + plural(nd.regions.length, 'región', 'regiones') + ', ' + plural(np, 'proyección', 'proyecciones') + '). Esto no se puede deshacer.', ok: 'Reemplazar', danger: true }).then(function (ok) {
        if (!ok) return;
        imgClear().then(function () {
          return allImgIds(nd).reduce(function (chain, id) {
            return chain.then(function () {
              var u = j.images && j.images[id];
              if (typeof u === 'string' && /^data:image\//.test(u)) { try { return imgPut(id, dataURLToBlob(u)); } catch (e) {} }
            });
          }, Promise.resolve());
        }).then(function () { data = nd; return saveNow(); }).then(function () { query = ''; show({ v: 'home' }); toast('Respaldo restaurado.'); });
      });
    };
    rd.onerror = function () { toast('No se pudo leer el archivo.'); };
    rd.readAsText(file);
  }
  $('fImp').addEventListener('change', function (e) { var f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); });

  /* ---------- Acciones ---------- */
  function moveRegion(dir) {
    var r = curR(), i = data.regions.indexOf(r), j = i + dir;
    while (j >= 0 && j < data.regions.length && data.regions[j].group !== r.group) j += dir;
    if (j < 0 || j >= data.regions.length) { toast(dir < 0 ? 'Ya es la primera de su apartado.' : 'Ya es la última de su apartado.'); return; }
    data.regions[i] = data.regions[j]; data.regions[j] = r; saveNow(); toast('Región movida.');
  }
  function addRegion(g) {
    dialog({ title: 'Nueva región', fields: [{ name: 'name', label: 'Nombre', required: true }, { name: 'group', label: 'División', value: g || 'Otras', list: allGroups() }], ok: 'Crear' }).then(function (v) {
      if (!v) return;
      var r = { id: uid(), name: v.name, group: v.group || 'Otras', projs: [] }, last = -1;
      data.regions.forEach(function (x, i) { if (x.group === r.group) last = i; });
      if (last >= 0) data.regions.splice(last + 1, 0, r); else data.regions.push(r);
      saveNow(); go({ v: 'region', rid: r.id });
    });
  }
  function addProj() {
    var r = curR();
    dialog({ title: 'Nueva proyección', fields: [{ name: 'name', label: 'Nombre', required: true }], ok: 'Crear' }).then(function (v) {
      if (!v) return;
      var p = mkProj(v.name); r.projs.push(p); saveNow(); go({ v: 'sheet', rid: r.id, pid: p.id });
    });
  }
  function delProj(r, p) {
    dialog({ title: 'Eliminar proyección', text: '¿Eliminar «' + p.name + '» y sus imágenes? No se puede deshacer.', ok: 'Eliminar', danger: true }).then(function (v) {
      if (!v) return;
      projImgIds(p).forEach(imgDel);
      r.projs.splice(r.projs.indexOf(p), 1);
      saveNow();
      if (view.v === 'sheet') up(); else render();
    });
  }
  var ACT = {
    'back': function () { up(); },
    'theme': function () { hideMenu(); setTheme(!isDark()); },
    'menu': function (b) {
      var mn = $('menu');
      if (!mn.hidden) { hideMenu(); return; }
      mn.innerHTML = menuItems().map(function (it) { return '<button type="button" role="menuitem" data-act="' + it[0] + '"' + (it[2] ? ' class="danger"' : '') + '>' + it[1] + '</button>'; }).join('');
      mn.hidden = false; b.setAttribute('aria-expanded', 'true');
      mn.querySelector('button').focus();
    },
    'fab': function () { if (view.v === 'home') addRegion(); else if (view.v === 'group') addRegion(view.g); else if (view.v === 'region') addProj(); },
    'open-group': function (b) { go({ v: 'group', g: b.dataset.g }); },
    'done': function () {
      var p = view.v === 'sheet' ? curP() : null;
      if (p && !p.name.trim()) p.name = 'Proyección sin nombre';
      p && (p.quality.items = p.quality.items.filter(function (t) { return t.trim(); }));
      edit = false; saveNow(); render(); window.scrollTo(0, 0);
    },
    'open-region': function (b) { go({ v: 'region', rid: b.dataset.rid }); },
    'open-proj': function (b) { go({ v: 'sheet', rid: b.dataset.rid, pid: b.dataset.pid }, b); },
    'open-detail': function (b) { openDetail(b.dataset.sec, +b.dataset.i); },
    'export': function () { exportAll(); },
    'import': function () { $('fImp').click(); },
    'texts': function () { $('fImp').click(); },
    'info': function () {
      var np = 0, nf = 0; data.regions.forEach(function (r) { r.projs.forEach(function (p) { np++; if (anyFilled(p)) nf++; }); });
      dialog({ title: 'Radiology 101 · v ' + APP_VERSION, text: plural(data.regions.length, 'región', 'regiones') + ', ' + plural(np, 'proyección', 'proyecciones') + ' (' + nf + ' con contenido) y ' + plural(allImgIds(data).length, 'imagen', 'imágenes') + ' guardadas en este dispositivo. Haz un respaldo de vez en cuando desde el menú.', ok: 'Cerrar', noCancel: true });
    },
    'r-edit': function () {
      var r = curR();
      dialog({ title: 'Renombrar región', fields: [{ name: 'name', label: 'Nombre', value: r.name, required: true }, { name: 'group', label: 'División', value: r.group, list: allGroups() }], ok: 'Guardar' }).then(function (v) {
        if (!v) return; r.name = v.name; r.group = v.group || 'Otras'; saveNow(); render();
      });
    },
    'r-up': function () { moveRegion(-1); },
    'r-down': function () { moveRegion(1); },
    'r-del': function () {
      var r = curR();
      dialog({ title: 'Eliminar región', text: '¿Eliminar «' + r.name + '» con sus ' + plural(r.projs.length, 'proyección', 'proyecciones') + ' y todas sus imágenes? No se puede deshacer.', ok: 'Eliminar', danger: true }).then(function (v) {
        if (!v) return;
        r.projs.forEach(function (p) { projImgIds(p).forEach(imgDel); });
        data.regions.splice(data.regions.indexOf(r), 1);
        saveNow(); up();
      });
    },
    'organize': function () { edit = true; render(); },
    'p-left': function (b) { if (move(curR().projs, +b.dataset.i, -1)) { saveNow(); render(); } },
    'p-right': function (b) { if (move(curR().projs, +b.dataset.i, 1)) { saveNow(); render(); } },
    'p-del-i': function (b) { var r = curR(); delProj(r, r.projs[+b.dataset.i]); },
    'edit-sheet': function () { edit = true; render(); window.scrollTo(0, 0); },
    'p-edit': function () {
      var p = curP();
      dialog({ title: 'Renombrar proyección', fields: [{ name: 'name', label: 'Nombre', value: p.name, required: true }], ok: 'Guardar' }).then(function (v) {
        if (!v) return; p.name = v.name; saveNow(); render();
      });
    },
    'p-del': function () { delProj(curR(), curP()); },
    'add-img': function (b) { pendingSec = b.dataset.sec; $('fImg').click(); },
    'img-left': function (b) { var a = curP()[b.dataset.sec].images; if (move(a, +b.dataset.i, -1)) { saveNow(); render(); } },
    'img-right': function (b) { var a = curP()[b.dataset.sec].images; if (move(a, +b.dataset.i, 1)) { saveNow(); render(); } },
    'img-del': function (b) {
      var a = curP()[b.dataset.sec].images, i = +b.dataset.i;
      dialog({ title: 'Quitar imagen', text: 'Se eliminará la imagen de la libreta. No se puede deshacer.', ok: 'Quitar', danger: true }).then(function (v) {
        if (!v) return; imgDel(a[i].id); a.splice(i, 1); saveNow(); render();
      });
    },
    'c-add': function () {
      curP().quality.items.push(''); saveNow(); render();
      var els = document.querySelectorAll('textarea[data-f="crit"]'); if (els.length) els[els.length - 1].focus();
    },
    'c-up': function (b) { if (move(curP().quality.items, +b.dataset.i, -1)) { saveNow(); render(); } },
    'c-down': function (b) { if (move(curP().quality.items, +b.dataset.i, 1)) { saveNow(); render(); } },
    'c-del': function (b) { curP().quality.items.splice(+b.dataset.i, 1); saveNow(); render(); }
  };
  var SLOW = { 'open-group': 1, 'back': 1, 'fab': 1, 'done': 1, 'open-region': 1, 'open-proj': 1, 'open-detail': 1, 'edit-sheet': 1, 'organize': 1, 'p-edit': 1, 'r-edit': 1, 'export': 1, 'import': 1, 'info': 1 };
  var PRESS_MS = 170, navBusy = false;
  document.addEventListener('click', function (e) {
    var inMenu = e.target.closest('#menu'), isTog = e.target.closest('[data-act="menu"]');
    if (!inMenu && !isTog) hideMenu();
    var b = e.target.closest('[data-act]');
    if (!b || !ACT[b.dataset.act]) return;
    var act = b.dataset.act;
    if (inMenu) hideMenu();
    if (!SLOW[act]) { ACT[act](b); return; }
    if (navBusy) return;
    navBusy = true; b.classList.add('pressed');
    setTimeout(function () {
      b.classList.remove('pressed');
      ACT[act](b);
      setTimeout(function () { navBusy = false; }, 320);
    }, PRESS_MS);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { query = t.value; renderHomeList(); return; }
    var f = t.getAttribute && t.getAttribute('data-f');
    if (!f) return;
    var p = curP(); if (!p) return;
    if (f === 'cap') p[t.dataset.sec].images[+t.dataset.i].cap = t.value;
    else if (f === 'crit') p.quality.items[+t.dataset.i] = t.value;
    else if (f === 'pname') p.name = t.value;
    else if (f === 'result.text') p.result.text = t.value;
    else if (f === 'position.patient') p.position.patient = t.value;
    else if (f === 'position.tube') p.position.tube = t.value;
    if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
    saveSoon();
  });
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });

  /* ---------- Pantalla de inicio ---------- */
  /* Versión de la app: se muestra en la pantalla de inicio. Debe coincidir con CACHE en sw.js */
  var APP_VERSION = '9.0.0';
  $('appVersion').textContent = 'v ' + APP_VERSION;
  var splashDone = false;
  function hideSplash() {
    if (splashDone) return; splashDone = true;
    var s = $('splash'); s.classList.add('out');
    setTimeout(function () { s.hidden = true; }, 450);
  }
  $('splash').addEventListener('click', hideSplash);
  var splashTimer = setTimeout(hideSplash, 2200);

  /* ---------- Arranque ---------- */
  openDB().then(function (d) {
    db = d; return kvGet('data');
  }).then(function (saved) {
    if (saved && saved.regions) data = sanitize(saved);
    else { data = seedData(); saveNow(); }
    var v = validView(history.state) || { v: 'home' };
    v.d = v.d || 0; view = v;
    try { history.replaceState(view, ''); } catch (e) { canPush = false; }
    render();
    if (view.v !== 'home') { clearTimeout(splashTimer); hideSplash(); }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { try { r.update(); } catch (e) {} }).catch(function () {});
    });
    /* Cuando llega una versión nueva, recarga una vez para mostrarla */
    var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadCtrl || reloaded) return; reloaded = true;
      saveNow(); setTimeout(function () { location.reload(); }, 150);
    });
  }
})();
</script>
</body>
